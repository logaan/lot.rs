[package]
name = "lot-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The `lot-tui` terminal user interface for Lists of Things."

[[bin]]
name = "lot-tui"
path = "src/main.rs"

[dependencies]
lot-core = { path = "../lot-core" }
anyhow.workspace = true
arboard.workspace = true
ratatui.workspace = true
pulldown-cmark.workspace = true
notify.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true

# SIGTSTP-based Ctrl-Z suspend is a Unix job-control feature; on other
# platforms the keypress is simply a no-op (see `suspend_to_background`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true
