[project]
name = "lot-textual-ui"
version = "0.1.0"
description = "Textual TUI front-end for LoT (Lists of Things)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual",
    "PyYAML",
    "textual-serve>=1.1.3",
]

[project.scripts]
lot-textual-ui = "lot_textual_ui.app:main"
lot-textual-ui-web = "lot_textual_ui.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lot_textual_ui"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
