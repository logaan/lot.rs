theme: nord
keybindings:
  quit: Q
  new_thing: 'n'
vaults:
- name: Personal
  path: ~/lot-vault
- path: /srv/shared-vault
vault-path: /Users/you/lot-vault
update-types:
- name: note
  takes-body: true
  terminal: false
- name: work
  takes-body: true
  terminal: false
- name: info
  takes-body: true
  terminal: false
- name: done
  takes-body: false
  terminal: true
- name: blocked
  takes-body: true
  terminal: false
- name: wont-do
  takes-body: false
  terminal: true
default-update-type: note
