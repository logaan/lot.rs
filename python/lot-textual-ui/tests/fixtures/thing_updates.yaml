  body: |
    # Textual TUI

    1.  I'm not very happy with the current TUI framework we're using in Rust.
    2.  I'd like to start again with a new TUI using the Python textual framework.
    3.  I'd like you to plan this work using a tree of child things under this
        thing.

    ## Architecture

    1.  Stick to the TUI over CLI architecture. The TUI shouldn't know anything
        about the on disk representation, all data it gathers and all modifications
        it make should be via the CLI.
    2.  Stick to the command palette populated dynamically using
        `lot help --format=yaml` pattern. I like that decoupling.

    ## Features

    1.  Meta
        1.  This is not an exhaustive list of features.
        2.  Not all of these are required for MVP.
        3.  But they should be planned to be added at some point.
        4.  Some of these features may require changes to the rust crates. 5. The
            rust TUI should not be changed. It will be abandoned in favour of this
            new TUI.
    2.  I need to be able to navigate via keyboard and mouse.
        1.  Vim style navigation.
        2.  Mouse should be able to click links, scroll with the scroll wheel,
            select text to be copied.
    3.  Ability to create new things and updates.
    4.  Ability to bulk archive things that have reached terminal states.
    5.  3 column layout.
        1.  If a thing is selected and it has children then
            1.  it, its siblings, and its ancestors are shown in the leftmost column
                in a tree.
            2.  its decendants are shown in the center column in a tree.
            3.  Its computed state is shown in the right column.
            4.  It update thread is shown in the right column.
                1.  Updates are shown as independent items, not just as concatenated
                    text.
    6.  I'd like to embrace the textual style of UI and textual features such as the
        command palette.
        1.  Try to use textual widgets where possible.
        2.  There may be community widgets worth pulling in.
    7.  Markdown rendering.
    8.  Navigation of markdown links to lot things and updates (eg:
        `See [Holiday Travel Plans](lot:6Ic9Cg6kx0Xk2hQhVz3aB) for details.` )
    9.  User level and vault level config.
        1.  Vault level config overrides user config.
    10. Ability to expand and collapse updates.
    11. Theme / colour scheme support.
    12. Hotkey help so people know what hotkeys are.

    ## Phases

    1.  I'd like you to structure the plan in phases. First an MVP, then each phase
        should improve things.
    2.  The MVP can be quite minimal.
        1.  I should be able to use it to navigate and view `~/lot-vault` and
            `~/code/personal/rust/wavelet/.lot-vault`.
            1.  It shouldn't have any baked in knowledge of those vaults. I just
                mean they contain the data I'll need to be working with.

    ## Pre-planning

    1.  Create a pre-planning child to this Thing.
    2.  Before you begin creating the plan I'd like you to ask me any clarifying
        questions, or decisions you need.
        1.  Each one should be a child Thing of the pre-planning thing.
    3.  I'll respond to each with an update.
    4.  Then respond back here once I'm done and send this thread back to claude to
        begin the actual planning (or more rounds of pre-planning if nessisary).
