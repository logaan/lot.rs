  body: |
    The plan is created. Your answers were clear enough that no second round of
    pre-planning was needed.

    [Plan](lot:033j83NC0p8ztmejm0hk94) holds nine phase Things, each with its work
    items as children (40 Things total). The phases:

    1.  [Phase 1 MVP read-only browser](lot:033j842KNa1o1tPEYpMNOw) — `lot thing
        updates` and `lot pui` on the Rust side; scaffold, CLI adapter,
        three-column layout, markdown detail pane, vim/mouse basics on the Python
        side.
    2.  [Phase 2 Live updating](lot:033j842NnQfHIylVV6XRWk) — `lot watch` YAML
        event stream carrying full change state; TUI consumes it incrementally.
    3.  [Phase 3 Command palette and content creation](lot:033j842R6sdDzhuryYQJCx)
        — Textual-native palette fed by `lot help --format=yaml`; new-Thing and
        new-Update forms; `$EDITOR` escape hatch on every input.
    4.  [Phase 4 Navigation and clipboard polish](lot:033j842UW6IURGaPYkO0zI) —
        `lot:` link navigation, expand/collapse updates, copy URI/path, mouse text
        selection.
    5.  [Phase 5 Config, themes and vault switching](lot:033j842Xptx1apf0NP8zEA)
        — vault-level config + merged `lot config get`; themes, keybinding
        overrides, in-app vault switching.
    6.  [Phase 6 Archive, move and batch operations](lot:033j842bF9pnQ8oNwQPYJ2)
        — `lot thing archive` (commit → delete → commit, abort on failure),
        `lot thing move`, multi-select batch actions.
    7.  [Phase 7 Custom update types](lot:033j842eYlIvf7p31PK94W) — config-defined
        update types, discovered dynamically by the TUI.
    8.  [Phase 8 Textual web](lot:033j842hg9mIk0Wa1QsdVF) — `lot web` via
        textual-serve for LAN access; web-mode adjustments.
    9.  [Phase 9 Cutover and distribution](lot:033j842ktcFDasJD2ESN5y) — repoint
        `lot interface`, delete `crates/lot-tui`, Homebrew (low priority).

    Notes:

    1.  Two small decisions weren't covered by your answers, so I made them and
        recorded them in the Plan Thing's body — veto with an update if wrong:
        Python 3.12+ as the target, and `lot-pui` as the Python package/entry
        point name (directory `python/lot-pui/`) to avoid a PATH clash with the
        Rust `lot-tui` binary until cutover.
    2.  `lot thing list` already returns the fully nested tree, so the MVP needs
        no new CLI surface for hierarchy — only `lot thing updates`.
    3.  All the features you added in later updates are placed: editor escape
        hatch (Phase 3), copy URI/path (Phase 4), vault switching (Phase 5),
        batch move/archive/update (Phase 6), custom update types (Phase 7),
        textual web + `lot web` (Phase 8), Homebrew (Phase 9).

    To start work, send any Phase or work-item Thing to Claude.
