name: Prepare release

# Cut a release from the GitHub UI: Actions -> "Prepare release" -> "Run
# workflow", then pick patch / minor / major. It bumps the workspace version,
# rolls CHANGELOG.md's `## [Unreleased]` section into `## [X.Y.Z]`, commits and
# tags `vX.Y.Z`, and pushes the tag -- which triggers the "Release" workflow
# that builds the binaries and publishes the GitHub Release.
#
# This is the point-and-click equivalent of running `scripts/release` locally.
#
# Requires a repo secret named `RELEASE_TOKEN`: a fine-grained Personal Access
# Token with "Contents: read and write" on this repo. GitHub deliberately stops
# the built-in GITHUB_TOKEN from triggering *other* workflows, so without this
# token the pushed tag would not start the Release build. One-time setup is
# documented in docs/release.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  prepare:
    name: Bump, tag and push
    runs-on: ubuntu-latest
    steps:
      - name: Check RELEASE_TOKEN is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. Add a fine-grained PAT with" \
                 "'Contents: read and write' on this repo, named RELEASE_TOKEN, under" \
                 "Settings -> Secrets and variables -> Actions. See docs/release.md."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          # Use the PAT so the tag we push triggers the Release workflow.
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Bump version, commit, tag and push
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          current=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          [ -n "$current" ] || { echo "::error::Could not read version from Cargo.toml"; exit 1; }
          IFS=. read -r maj min pat <<< "$current"
          case "$BUMP" in
            patch) new="$maj.$min.$((pat + 1))" ;;
            minor) new="$maj.$((min + 1)).0" ;;
            major) new="$((maj + 1)).0.0" ;;
            *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
          esac
          tag="v$new"
          echo "Releasing $current -> $new (tag $tag)"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."; exit 1
          fi

          # Bump the [workspace.package] version in Cargo.toml...
          awk -v v="$new" '!done && /^version = "/ { sub(/"[^"]+"/, "\"" v "\""); done=1 } { print }' \
            Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml

          # ...and the two workspace members' entries in Cargo.lock, so the
          # committed tree stays consistent without needing a Rust toolchain here.
          awk -v v="$new" '
            /^name = "lot-(cli|core)"$/ { print; getline; sub(/"[^"]+"/, "\"" v "\"") }
            { print }
          ' Cargo.lock > Cargo.lock.tmp && mv Cargo.lock.tmp Cargo.lock

          # Roll CHANGELOG.md: move the `## [Unreleased]` content into a new
          # `## [X.Y.Z] - YYYY-MM-DD` section (this becomes the Release body),
          # leave a fresh empty Unreleased at the top, and refresh the
          # comparison links at the bottom. If Unreleased is empty, fall back
          # to a placeholder entry so the release notes are never empty.
          empty=0
          awk '/^## \[Unreleased\]/ { f = 1; next } f && /^## / { exit } f' CHANGELOG.md \
            | grep -q '[^[:space:]]' || empty=1
          [ "$empty" -eq 1 ] && echo "::warning::CHANGELOG.md has no Unreleased entries; using a placeholder."
          awk -v ver="$new" -v date="$(date -u +%Y-%m-%d)" -v empty="$empty" '
            /^## \[Unreleased\]/ {
              print "## [Unreleased]"
              print ""
              printf "## [%s] - %s\n", ver, date
              if (empty) { print ""; print "- Maintenance release."; print "" }
              in_unreleased = 1
              skip_blanks = empty
              next
            }
            in_unreleased && /^## / { in_unreleased = 0; skip_blanks = 0 }
            skip_blanks { next }
            /^\[Unreleased\]: / {
              base = $0; sub(/^\[Unreleased\]: /, "", base)
              prev = base
              sub(/\/compare\/v.*$/, "", base)
              sub(/^.*\/compare\/v/, "", prev); sub(/\.\.\.HEAD$/, "", prev)
              printf "[Unreleased]: %s/compare/v%s...HEAD\n", base, ver
              printf "[%s]: %s/compare/v%s...v%s\n", ver, base, prev, ver
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $tag"
          git tag -a "$tag" -m "Release $tag"
          git push origin HEAD:main
          git push origin "$tag"

          echo "Pushed $tag. Watch the Release workflow under the Actions tab."
