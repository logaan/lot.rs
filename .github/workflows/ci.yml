name: CI

# Mirrors `scripts/check`: Rust format check, lints (warnings as errors), and
# tests, plus the Python sub-project's ruff check, ruff format --check, and
# pytest.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt --check
        run: ./scripts/fmt-check

      - name: clippy (warnings as errors)
        run: ./scripts/lint

      - name: tests
        run: ./scripts/test

  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/lot-textual-ui
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: python/lot-textual-ui/uv.lock

      - name: uv sync
        run: uv sync

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: pytest
        run: uv run pytest
