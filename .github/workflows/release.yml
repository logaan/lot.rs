name: Release

# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Builds the `lot` binary for each target and uploads archives + checksums
# to a GitHub Release for the tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create the GitHub Release once, before the matrix uploads assets to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # Release title is the version with the leading `v` stripped, e.g. 0.1.0.
          title: $version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build the release body from changelog.d: the release commit rolled
      # changelog.d/unreleased/ into a `X.Y.Z - <date>/` folder, and
      # `scripts/changelog render` turns that folder into markdown. It fails if
      # the tagged version has no folder, so keep the changelog rolled. The
      # changelog alone doesn't tell people how to get the thing, so append
      # install instructions too.
      - name: Compose the release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/changelog render "${TAG#v}" > notes.md
          cat >> notes.md <<'EOF'

          ## Installing

          With Homebrew (macOS or Linux):

              brew install logaan/tap/lot

          Or download the archive for your platform below, verify the `.sha256` checksum, and put the `lot` binary on your PATH.
          EOF
          gh release edit "$TAG" --notes-file notes.md

  # The Python Textual UI ships alongside the binaries as an sdist, so the
  # Homebrew formula can install it (see scripts/update-tap). The asset pair is
  # `lot_textual_ui-X.Y.Z.tar.gz` + `lot_textual_ui-X.Y.Z.sha256`, mirroring
  # the binary archives' naming style.
  upload-python-sdist:
    needs: create-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/lot-textual-ui
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Check the Python UI version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' pyproject.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::python/lot-textual-ui/pyproject.toml is at $version but the tag is $TAG." \
                 "scripts/release and prepare-release.yml bump it with the workspace version;" \
                 "fix the version and re-tag."
            exit 1
          fi

      - name: Build the sdist
        run: uv build --sdist --out-dir dist

      - name: Upload the sdist and checksum to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sdist=$(ls lot_textual_ui-*.tar.gz)
          sha256sum "$sdist" > "${sdist%.tar.gz}.sha256"
          gh release upload "$TAG" "$sdist" "${sdist%.tar.gz}.sha256"

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: lot
          target: ${{ matrix.target }}
          # Archive name, e.g. lot-v0.1.0-aarch64-apple-darwin.tar.gz
          archive: lot-$tag-$target
          tar: unix
          zip: windows
          checksum: sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
