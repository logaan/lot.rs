name: Release

# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Builds the `lot` binary for each target and uploads archives + checksums
# to a GitHub Release for the tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create the GitHub Release once, before the matrix uploads assets to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # Release title is the version with the leading `v` stripped, e.g. 0.1.0.
          title: $version
          # Release body is this version's section of CHANGELOG.md (the release
          # commit rolled `## [Unreleased]` into `## [X.Y.Z]`). Fails if the
          # version has no section, so keep the changelog rolled.
          changelog: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The changelog section alone doesn't tell people how to get the thing,
      # so append install instructions to the release notes.
      - name: Append install instructions to the release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > notes.md
          cat >> notes.md <<'EOF'

          ## Installing

          With Homebrew (macOS or Linux):

              brew install logaan/tap/lot

          Or download the archive for your platform below, verify the `.sha256` checksum, and put the `lot` binary on your PATH.
          EOF
          gh release edit "$TAG" --notes-file notes.md

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: lot
          target: ${{ matrix.target }}
          # Archive name, e.g. lot-v0.1.0-aarch64-apple-darwin.tar.gz
          archive: lot-$tag-$target
          tar: unix
          zip: windows
          checksum: sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
