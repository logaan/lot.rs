[workspace]
resolver = "2"
members = ["crates/lot-core", "crates/lot-cli", "crates/lot-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Logan Campbell"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "0.8"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
# `string` lets runtime-built commands (config-defined update types in the
# help tree) use owned names.
clap = { version = "4", features = ["derive", "string"] }
shellexpand = "3"
# unstable-rendered-line-info: Paragraph::line_count, needed to clamp the
# detail-pane scroll by wrapped rows rather than logical lines.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
pulldown-cmark = "0.13"
notify = "8"
libc = "0.2"
# default-features off skips image-clipboard support and its heavy deps.
arboard = { version = "3", default-features = false }

[profile.release]
strip = true
lto = true
