[workspace]
resolver = "2"
members = ["crates/lot-core", "crates/lot-cli"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["Logan Campbell"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "0.8"
# Format-preserving TOML editing, used to write a single key (e.g. the
# front-end theme) back into the user config without discarding its comments
# or layout. Pinned to the same 0.22 the `toml` crate already resolves to.
toml_edit = "0.22"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
# `string` lets runtime-built commands (config-defined update types in the
# help tree) use owned names.
clap = { version = "4", features = ["derive", "string"] }
shellexpand = "3"
notify = "8"

[profile.release]
strip = true
lto = true
