[vault]
path="~/lot-vault"
# Set auto-commit to false to stop lot running git at all (no repo
# initialisation, no commits). Useful in a project-local .lot.toml when the
# vault lives inside the project repo and you want to batch vault changes
# into your own commits.
# auto-commit=true

# Update types, used as `lot update <name>`. Types are entirely
# config-defined: lot has no built-in types. A new vault's own config
# (<vault>/.lot/config.toml) is seeded with the stock set — note, work, info,
# and done — and the same stock set applies whenever no [[update-types]] are
# defined at either level, so you only need entries here to change things.
# Each type has a name plus two flags: takes-body (does it accept a body,
# like work; default true) and terminal (does it retire the Thing, like done;
# default false). Names must start with a lowercase letter and contain only
# lowercase letters, digits, and hyphens; `path` is reserved (it collides
# with `lot update path`). Vault-level [[update-types]] override same-named
# entries here and extend the list. Repeat the [[update-types]] block for
# each type.
# [[update-types]]
# name = "blocked"
#
# [[update-types]]
# name = "wont-do"
# takes-body = false
# terminal = true

# Thing-creation settings. default-update-type names the type `lot thing new`
# writes as a Thing's first update; it must be one of the effective update
# types. The vault-level config may set the same key to override this per
# vault. Defaults to "note".
# [thing]
# default-update-type = "note"

# Front-end (TUI) settings. Everything here is optional; front-ends fall back to
# their own defaults for anything you leave out. A vault-level config file at
# <vault>/.lot/config.toml may set the same [tui] keys to override these per
# vault (vault wins field-by-field).
# [tui]
# The colour scheme / theme name the front-end should use.
# theme = "dark"

# Keybinding overrides: a map of action name -> key. Only the actions you list
# are overridden; the rest keep the front-end's defaults.
# [tui.keybindings]
# quit = "q"
# down = "j"
# up = "k"

# The vaults the front-end can switch between. Each entry has a path and an
# optional name. Repeat the [[tui.vaults]] block for each vault.
# [[tui.vaults]]
# name = "Personal"
# path = "~/lot-vault"
#
# [[tui.vaults]]
# name = "Work"
# path = "~/work-vault"
