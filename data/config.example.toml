# LoT (Lists of Things) — user configuration.
#
# Created from this commented example the first time you run `lot`. Every
# option is shown below; uncomment the ones you want. Config is resolved
# highest-priority first:
#
#   1. $LOT_VAULT_PATH — when set, used as the vault path directly. It pins
#      only the path: every other setting (auto-commit included) still comes
#      from the files below. This is how `lot interface`, `lot web`, and
#      `lot claude send` pin the vault for the sessions they launch.
#   2. A project-local `.lot.toml` in the current directory — *overlaid* on top
#      of this file field-by-field (not a wholesale replacement). It usually
#      just sets `[vault].path`; keys it omits fall through to this file.
#   3. This file ($XDG_CONFIG_HOME/lot/config.toml, i.e. ~/.config/lot/config.toml).
#   4. A vault's own `<vault>/.lot/config.toml` overrides the `[tui]`,
#      `[[update-types]]`, and `[thing]` settings below when that vault is
#      active (the vault wins field-by-field).
#
# `lot settings get` prints the final merged result of all of the above.

# ── Vault ─────────────────────────────────────────────────────────────────────
[vault]

# Where Things are stored on disk. A leading `~` expands to your home directory.
path = "~/lot-vault"

# Let `lot` run git for you: initialise the repo on first use and commit after
# every change. Default: true. Set false to keep `lot` out of git entirely — no
# init, no commits — which is useful in a project-local `.lot.toml` when the
# vault lives inside the project's own repo and you want vault changes batched
# into your own commits. Note: archiving needs auto-commit on (it preserves a
# Thing by committing it before deletion), so leave this true here.
# auto-commit = true

# ── Update types ──────────────────────────────────────────────────────────────
#
# The typed updates `lot update <name>` can create. `lot` has NO built-in
# types: a new vault is seeded with the stock set — note, work, info, done — in
# its own `<vault>/.lot/config.toml`, and that same set also applies whenever no
# `[[update-types]]` are declared anywhere. Add entries here only to define
# extra types or change the effective set. Each type has:
#
#   name        required. Lowercase letters, digits, and hyphens, starting with
#               a letter. `path` is reserved (it collides with `lot update path`).
#   takes-body  does it accept a body?          default: true
#   terminal    does adding it retire the Thing? default: false
#
# Vault-level `[[update-types]]` override same-named entries here and add new
# ones. Repeat the block per type. Uncomment to use:
#
# [[update-types]]
# name = "blocked"                 # a body-taking, non-terminal note (defaults)
#
# [[update-types]]
# name = "wont-do"
# takes-body = false
# terminal = true                  # a body-less, retiring marker, like `done`

# ── Thing creation ────────────────────────────────────────────────────────────
#
# The update type `lot thing new` writes as a Thing's first update. Must name
# one of the effective update types. Default: "note".
#
# [thing]
# default-update-type = "note"

# ── Front-end (TUI) settings ──────────────────────────────────────────────────
#
# Read by the Textual UI (`lot interface` / `lot web`). All optional — the
# front-end supplies its own default for anything unset. A vault-level `[tui]`
# table overrides `theme` and `keybindings` per vault.
# [tui]

# Colour scheme. The name is the front-end's own: the Textual UI knows Textual's
# built-in themes — e.g. "textual-dark", "textual-light", "nord", "gruvbox",
# "dracula", "monokai", "solarized-light" — plus "ansi-dark" / "ansi-light".
# Unset leaves the UI's own default. The palette's "Switch theme" command (and
# `lot settings set theme <name>`) writes your pick back into this key.
# theme = "textual-dark"

# Keybinding overrides: action-name -> key. Only the actions you list change;
# every other keeps its default. Multiple keys for one action: comma-separate
# them (e.g. "s,down"). The remappable actions and their default keys:
#
#   quit             q       leave the app
#   command_nav      space   open the hierarchical command navigator
#   command_palette  ctrl+p  open the fuzzy command palette
#   cursor_down      j       move the focused pane's cursor down a row
#   cursor_up        k       move it up a row
#   cursor_top       g       jump to the first row
#   cursor_bottom    G       jump to the last row
#   focus_right      l       drill in  (left tree -> centre tree -> detail)
#   focus_left       h       drill back out
#   new_thing        n       create a new top-level Thing
#   new_child_thing  a       add a child under the current selection
#   copy_thing_uri   y       copy the selected Thing's lot: id
#   copy_thing_path  Y       copy the selected Thing's filesystem path
#   copy_selection   c       copy the current mouse text-selection
#   toggle_update    z       collapse/expand the focused update in the thread
#   toggle_mark      x       mark/unmark the Thing under the cursor
#   clear_marks      u       drop every mark
#   batch_move       m       move the marked Things under a picked parent
#   batch_archive    d       archive the marked Things (with confirmation)
#   batch_update     U       append one update to every marked Thing
#
# [tui.keybindings]
# quit = "Q"
# cursor_down = "down"
# cursor_up = "up"

# The vaults the front-end's switcher can jump between. Each entry has a `path`
# (leading `~` ok) and an optional display `name`. This is user-level only — a
# vault-level config cannot set it. Repeat the block per vault. Uncomment to use:
#
# [[tui.vaults]]
# name = "Personal"
# path = "~/lot-vault"
#
# [[tui.vaults]]
# name = "Work"
# path = "~/work-vault"
